<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Axeena ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: Georgia, serif;
        overflow: hidden;
    }

    .box {
        background: white;
        padding: 40px;
        width: 400px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h1 {
        color: #e63946;
        margin-bottom: 25px;
    }

    button {
        padding: 10px 22px;
        font-size: 16px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin: 10px;
    }

    #yes {
        background: #e63946;
        color: white;
    }

    #no {
        background: #555;
        color: white;
        position: absolute;
    }

    #cat {
        font-size: 80px;
        display: none;
        margin-top: 20px;
    }

    #kiss {
        font-size: 40px;
        display: none;
    }
</style>
</head>

<body>

<div class="box" id="box">
    <h1>Will you be my Valentine, Axeena? ❤️</h1>

    <button id="yes" onclick="sayYes()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 🙃</butt
